[project]
name = "airbnb-experiences-incrementality-engine"
version = "2.0.0"
description = "Airbnb Experiences demand signal and marketing incrementality portfolio project."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "tabulate>=0.9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
